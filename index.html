    this.state.heroXp += e.isBoss ? 45 : 6;
    var xpNeeded = this.state.heroLevel * 45;
    if (this.state.heroXp >= xpNeeded) {
      this.state.heroXp -= xpNeeded;
      this.state.heroLevel++;
      this.addFloatingText(this.hero.x, this.hero.y - 40, "🎉 英雄升級 Lv." + this.state.heroLevel + "！", "#38bdf8", 18);
      window.SoundEngine.playUpgradeComplete();
    }

    var goldMult = (1 + this.getTalentVal("t_gold_drop")) * (1 + this.getEquipStat("goldBonus")) * this.getDivinityMult();
    var totalGold = Math.max(3, Math.round(e.gold * goldMult));
    var coinPiles = e.isBoss ? 8 : (totalGold > 20 ? 3 : 2);
    var perCoin = Math.max(1, Math.round(totalGold / coinPiles));

    for (var c = 0; c < coinPiles; c++) {
      this.spawnLootDrop(
        e.x + (Math.random() - 0.5) * 38,
        e.y + (Math.random() - 0.5) * 32,
        "gold",
        perCoin
      );
    }

    var manaChance = 0.25 + this.getTalentVal("t_mana_drop") * 0.5;
    if (e.isBoss || Math.random() < manaChance) {
      var manaAmt = Math.max(1, Math.round((e.isBoss ? 15 : 2) * (1 + this.getTalentVal("t_mana_drop"))));
      this.spawnLootDrop(e.x + (Math.random() - 0.5) * 28, e.y + (Math.random() - 0.5) * 28, "mana", manaAmt);
    }

    if (e.isBoss || Math.random() < 0.05) {
      if (e.isBoss) {
        var soulGain = Math.max(1, Math.round(2 * this.getCurrentRealm().id));
        this.state.souls += soulGain;
        this.addFloatingText(e.x, e.y - 24, "🔮 靈魂結晶 +" + soulGain, "#d8b4fe", 16);
      }
      this.spawnLootDrop(e.x, e.y, "chest", 1);
    }

    this.spawnBurstParticles(e.x, e.y, "#38bdf8", e.isBoss ? 22 : 10);
  },

  updateProjectiles: function(dt) {
    for (var i = this.projectiles.length - 1; i >= 0; i--) {
      var p = this.projectiles[i];
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.life -= dt;
      if (p.life <= 0) {
        this.projectiles.splice(i, 1);
        continue;
      }

      for (var j = this.enemies.length - 1; j >= 0; j--) {
        var e = this.enemies[j];
        if (p.hitIds[e.id]) continue;
        if (Math.hypot(e.x - p.x, e.y - p.y) <= e.radius + 15) {
          p.hitIds[e.id] = true;
          p.pierce--;
          window.SoundEngine.playHit(p.kind);

          if (p.kind === "frost") {
            e.slowTimer = 2.8;
            this.spawnBurstParticles(e.x, e.y, "#38bdf8", 8);
            this.damageEnemy(e, p.dmg, "#7dd3fc", true);
          } else if (p.kind === "hammer" || p.kind === "holy_hammer" || p.kind === "arcane_chain") {
            this.spawnBurstParticles(e.x, e.y, "#60a5fa", 12);
            var jumps = 0;
            for (var k = 0; k < this.enemies.length; k++) {
              var sub = this.enemies[k];
              if (Math.hypot(sub.x - e.x, sub.y - e.y) < 105) {
                if (jumps < 3 && sub.id !== e.id) {
                  this.lightningArcs.push({ x1: e.x, y1: e.y, x2: sub.x, y2: sub.y, color: "#93c5fd", life: 0.18 });
                  jumps++;
                }
                sub.stunTimer = Math.max(sub.stunTimer, 0.45);
                this.damageEnemy(sub, Math.round(p.dmg * 0.85), "#60a5fa", true);
              }
            }
          } else if (p.kind === "flame" || p.kind === "dragon") {
            this.burnZones.push({ x: e.x, y: e.y, radius: 68, dps: p.dmg * 0.45, life: 3.2 });
            this.spawnBurstParticles(e.x, e.y, "#f97316", 12);
            this.damageEnemy(e, p.dmg, "#fb923c", true);
          } else if (p.kind === "void") {
            for (var v = 0; v < this.enemies.length; v++) {
              var ve = this.enemies[v];
              var vDist = Math.hypot(ve.x - e.x, ve.y - e.y);
              if (vDist < 140 && vDist > 5) {
                ve.x += ((e.x - ve.x) / vDist) * 38;
                ve.y += ((e.y - ve.y) / vDist) * 38;
              }
            }
            this.damageEnemy(e, p.dmg + Math.round(e.maxHp * 0.03), "#c084fc", true);
          } else {
            this.damageEnemy(e, p.dmg, p.color, true);
          }

          if (e.hp <= 0) {
            this.killEnemy(j);
          }
          if (p.pierce <= 0) {
            this.projectiles.splice(i, 1);
            break;
          }
        }
      }
    }
  },

  spawnLootDrop: function(x, y, kind, amount) {
    if (this.lootDrops.length > 90 && kind === "gold") {
      this.lootDrops[0].amount += amount;
      return;
    }
    this.lootDrops.push({
      x: Math.max(80, Math.min(this.width - 80, x)),
      y: Math.max(110, Math.min(this.height - 90, y)),
      kind: kind,
      amount: amount,
      age: 0
    });
  },

  updateLootAndFlyingCoins: function(dt) {
    var cls = this.getCurrentHeroClass();
    var magnetRange = 115 * cls.magnetBonus * (1 + this.getTalentVal("t_magnet_rad"));

    for (var i = this.lootDrops.length - 1; i >= 0; i--) {
      var d = this.lootDrops[i];
      d.age += dt;
      var dist = Math.hypot(this.hero.x - d.x, this.hero.y - d.y);
      if (dist < magnetRange || d.age > 6.5) {
        var pullSpeed = d.age > 6.5 ? 540 : 400;
        var dx = this.hero.x - d.x;
        var dy = this.hero.y - d.y;
        var len = Math.max(1, Math.hypot(dx, dy));
        d.x += (dx / len) * pullSpeed * dt;
        d.y += (dy / len) * pullSpeed * dt;
        if (len < 24) {
          this.collectLootDrop(i);
        }
      }
    }

    for (var f = this.flyingCoins.length - 1; f >= 0; f--) {
      var fc = this.flyingCoins[f];
      fc.progress += fc.speed * dt;
      if (fc.progress >= 1) {
        this.flyingCoins.splice(f, 1);
      }
    }
  },

  collectLootDrop: function(index) {
    var d = this.lootDrops[index];
    if (!d) return;
    this.lootDrops.splice(index, 1);

    if (d.kind === "gold") {
      this.state.gold += d.amount;
      this.state.totalGoldEarned += d.amount;
      window.SoundEngine.playCoinPickup();
    } else if (d.kind === "mana") {
      this.state.mana += d.amount;
      this.addFloatingText(this.hero.x, this.hero.y - 28, "💎 +" + d.amount, "#38bdf8", 13);
      window.SoundEngine.playCoinPickup();
    } else if (d.kind === "chest") {
      var item = this.rollRandomEquipment();
      this.addFloatingText(this.hero.x, this.hero.y - 34, "🎁 獲得：" + item.name, item.color, 15);
      window.SoundEngine.playUpgradeComplete();
    }
  },

  rollRandomEquipment: function(minRarity) {
    var slots = ["weapon", "armor", "ring", "relic"];
    var slot = slots[Math.floor(Math.random() * slots.length)];
    var templates = window.GAME_DATA.equipTemplates[slot];
    var tmpl = templates[Math.floor(Math.random() * templates.length)];

    var rRoll = Math.random() + (this.state.realmId - 1) * 0.08 + Math.min(0.25, this.state.wave * 0.004);
    var tier = minRarity || 0;
    if (rRoll > 1.18) tier = Math.max(tier, 5);
    else if (rRoll > 0.98) tier = Math.max(tier, 4);
    else if (rRoll > 0.80) tier = Math.max(tier, 3);
    else if (rRoll > 0.55) tier = Math.max(tier, 2);
    else if (rRoll > 0.28) tier = Math.max(tier, 1);

    var rDef = window.GAME_DATA.rarities[tier];
    var item = {
      id: "eq_" + Date.now() + "_" + Math.floor(Math.random() * 9999),
      slot: slot,
      name: "【" + rDef.name + "】" + tmpl.name,
      icon: tmpl.icon,
      tier: tier,
      color: rDef.color,
      statType: tmpl.statType,
      val: Number((tmpl.baseVal * rDef.mult).toFixed(2))
    };

    var cur = this.state.equipped[slot];
    if (!cur || item.val > cur.val) {
      if (cur) this.state.inventory.push(cur);
      this.state.equipped[slot] = item;
      this.recalcWallStats(false);
    } else {
      this.state.inventory.push(item);
    }
    if (this.state.inventory.length > 36) {
      this.state.inventory.shift();
    }
    return item;
  },

  mergeAllInventory: function() {
    var mergedCount = 0;
    for (var t = 0; t < 5; t++) {
      var matching = this.state.inventory.filter(function(i) { return i.tier === t; });
      while (matching.length >= 3) {
        var toRemove = matching.splice(0, 3);
        var removeIds = toRemove.map(function(x) { return x.id; });
        this.state.inventory = this.state.inventory.filter(function(i) {
          return removeIds.indexOf(i.id) === -1;
        });
        this.rollRandomEquipment(t + 1);
        mergedCount++;
      }
    }
    return mergedCount;
  },

  castSkill: function(index) {
    var sk = this.skills[index];
    if (!sk || sk.cd > 0) return;
    sk.cd = sk.maxCd;
    window.SoundEngine.playSkill();

    if (sk.id === "nova") {
      this.spawnBurstParticles(this.hero.x, this.hero.y, "#38bdf8", 32);
      var dmg = this.getHeroDamage() * 4.5;
      for (var i = this.enemies.length - 1; i >= 0; i--) {
        if (Math.hypot(this.enemies[i].x - this.hero.x, this.enemies[i].y - this.hero.y) < 380) {
          this.damageEnemy(this.enemies[i], dmg, "#38bdf8", true);
          if (this.enemies[i].hp <= 0) this.killEnemy(i);
        }
      }
      for (var l = 0; l < this.lootDrops.length; l++) {
        this.lootDrops[l].age = 99;
      }
      this.addFloatingText(this.hero.x, this.hero.y - 45, "🌪️ 風暴吸金！", "#38bdf8", 18);
    } else if (sk.id === "aegis") {
      sk.buffTimer = 8.0;
      this.wall.hp = Math.min(this.wall.maxHp, this.wall.hp + Math.round(this.wall.maxHp * 0.45));
      if (this.halls) {
        this.halls.forEach(function(h) {
          h.hp = Math.min(h.maxHp, h.hp + Math.round(h.maxHp * 0.40));
        });
      }
      this.gateBreached = false;
      this.addFloatingText(this.hero.x, this.hero.y - 45, "🛡️ 聖光壁壘：要塞修復！", "#fde047", 18);
    } else if (sk.id === "meteor") {
      this.triggerCataclysm(false);
    }
  },

  triggerCataclysm: function(fromShrine) {
    var dmg = this.getHeroDamage() * (fromShrine ? 9.0 : 6.5);
    for (var m = 0; m < 12; m++) {
      var mx = 450 + Math.random() * (this.width - 600);
      var my = 200 + Math.random() * (this.height - 400);
      this.spawnBurstParticles(mx, my, "#38bdf8", 18);
      this.burnZones.push({ x: mx, y: my, radius: 85, dps: dmg * 0.25, life: 4.0 });
    }
    for (var i = this.enemies.length - 1; i >= 0; i--) {
      this.enemies[i].stunTimer = 1.8;
      this.damageEnemy(this.enemies[i], dmg, "#fb923c", true);
      if (this.enemies[i].hp <= 0) this.killEnemy(i);
    }
  },

  checkQuestProgress: function() {
    var q = window.GAME_DATA.quests[this.state.questIndex];
    if (!q) return;
    var done = false;
    var self = this;

    if (q.type === "any_tower_built") {
      (window.GAME_DATA.groundPads || []).forEach(function(p) {
        if (p.customizable && self.state.pads[p.id] && self.state.pads[p.id].level >= 1) done = true;
      });
    } else if (q.type === "wave") {
      if (this.state.wave > q.goal) done = true;
    } else if (q.type === "zone") {
      if (this.state.unlockedZones.indexOf(q.goal) !== -1) done = true;
    } else if (q.type === "any_tower_lv") {
      (window.GAME_DATA.groundPads || []).forEach(function(p) {
        if (p.customizable && self.state.pads[p.id] && self.state.pads[p.id].level >= q.goal) done = true;
      });
    } else if (q.type === "any_troop_built") {
      (window.GAME_DATA.groundPads || []).forEach(function(p) {
        if (p.customizable && self.state.pads[p.id] && self.state.pads[p.id].level >= q.goal) {
          var bp = self.getPadBlueprint(p);
          if (bp && bp.category === "barracks") done = true;
        }
      });
    } else if (q.type === "unlock_bp_count") {
      if (this.state.unlockedBlueprints.length >= q.goal) done = true;
    }

    if (done) {
      this.state.gold += q.rewardGold;
      this.state.mana += q.rewardMana;
      this.state.souls += q.rewardSoul;
      this.state.questIndex++;
      window.SoundEngine.playUpgradeComplete();
      if (window.GameUI) {
        window.GameUI.showToast("🏆 完成任務【" + q.title + "】！獲得 🪙" + q.rewardGold + " 💎" + q.rewardMana + " 🔮" + q.rewardSoul);
        window.GameUI.updateHUD();
      }
    }
  },

  changeRealm: function(newRealmId, isRebirth) {
    var startGold = 200 + this.getTalentVal("t_start_gold");
    this.state.realmId = newRealmId;
    this.state.wave = 1;
    this.state.gold = startGold;
    this.state.unlockedZones = [0];

    // Load new map configuration for this realm
    this.loadRealmMap(newRealmId);

    // Initialize pads for this realm
    var self = this;
    (window.GAME_DATA.groundPads || []).forEach(function(p) {
      var startLv = (p.id === "pad_TownHall" || p.id === "pad_GateInner" || p.id === "pad_FrostStatue") ? 1 : 0;
      var defaultBp = p.defaultBlueprint || "bp_arcane_spire";
      self.state.pads[p.id] = {
        level: startLv,
        invested: 0,
        cooldown: 0,
        blueprintId: p.customizable ? (startLv > 0 ? defaultBp : null) : null,
        atkTimer: 0
      };
    });

    this.enemies = [];
    this.projectiles = [];
    this.lootDrops = [];
    this.allies = [];
    this.burnZones = [];
    this.isDefeated = false;
    this.recalcWallStats(true);
    this.setupWave(1);
    this.saveGame();

    if (window.GameUI) {
      window.GameUI.updateHUD();
      window.GameUI.updateContextCard();
      window.GameUI.showToast(isRebirth ? "✨ 轉生成功！神性加成已提升！" : "🗺️ 已進入：" + this.getCurrentRealm().name);
    }
  },

  performRebirth: function() {
    var earnedSouls = Math.max(2, Math.floor(this.state.wave * 0.6 * this.state.realmId));
    var earnedDivinity = Math.max(1, Math.floor(this.state.wave / 5) * this.state.realmId);
    this.state.souls += earnedSouls;
    this.state.divinity += earnedDivinity;
    this.state.rebirthCount += 1;
    this.changeRealm(this.state.realmId, true);
  },

  spawnBurstParticles: function(x, y, color, count) {
    for (var i = 0; i < count; i++) {
      var a = Math.random() * Math.PI * 2;
      var spd = 40 + Math.random() * 140;
      this.particles.push({
        x: x,
        y: y,
        vx: Math.cos(a) * spd,
        vy: Math.sin(a) * spd,
        color: color,
        size: 3 + Math.random() * 4,
        life: 0.45 + Math.random() * 0.35
      });
    }
  },

  addFloatingText: function(x, y, text, color, size) {
    if (this.floatingTexts.length > 35) this.floatingTexts.shift();
    this.floatingTexts.push({
      x: x,
      y: y,
      text: text,
      color: color || "#ffffff",
      size: size || 14,
      life: 1.05
    });
  },

  updateParticlesAndTexts: function(dt) {
    for (var i = this.particles.length - 1; i >= 0; i--) {
      var p = this.particles[i];
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.life -= dt;
      if (p.life <= 0) this.particles.splice(i, 1);
    }
    for (var j = this.floatingTexts.length - 1; j >= 0; j--) {
      var ft = this.floatingTexts[j];
      ft.y -= 32 * dt;
      ft.life -= dt;
      if (ft.life <= 0) this.floatingTexts.splice(j, 1);
    }
  },

  saveGame: function() {
    try {
      this.state.lastSaveTimestamp = Date.now();
      localStorage.setItem("AAB_SAVE_V1", JSON.stringify(this.state));
    } catch (e) {}
  },

  loadSave: function() {
    try {
      var raw = localStorage.getItem("AAB_SAVE_V1");
      if (!raw) return;
      var parsed = JSON.parse(raw);
      if (parsed && typeof parsed.gold === "number") {
        for (var k in parsed) {
          if (Object.prototype.hasOwnProperty.call(parsed, k)) {
            this.state[k] = parsed[k];
          }
        }
        var elapsedSec = Math.floor((Date.now() - (this.state.lastSaveTimestamp || Date.now())) / 1000);
        if (elapsedSec > 60) {
          var cappedSec = Math.min(elapsedSec, 36000);
          var mineLv = Math.max(1, (this.state.pads["pad_GoldMine"] && this.state.pads["pad_GoldMine"].level) || 1);
          var offMult = (1 + this.getTalentVal("t_offline_gain")) * this.getDivinityMult();
          var offGold = Math.round(cappedSec * mineLv * 1.8 * offMult);
          var offMana = Math.round(cappedSec * 0.08 * offMult);
          this.state.gold += offGold;
          this.state.mana += offMana;
        }
      }
    } catch (e) {}
  },

  screenToWorld: function(clientX, clientY) {
    var rect = this.canvas.getBoundingClientRect();
    var sx = clientX - rect.left;
    var sy = clientY - rect.top;
    return {
      x: (sx - this.camera.x) / this.camera.zoom,
      y: (sy - this.camera.y) / this.camera.zoom
    };
  },

  bindInputs: function() {
    var self = this;
    window.addEventListener("keydown", function(e) {
      self.input.keys[e.code] = true;
    });
    window.addEventListener("keyup", function(e) {
      self.input.keys[e.code] = false;
    });

    this.canvas.addEventListener("wheel", function(e) {
      e.preventDefault();
      var delta = e.deltaY > 0 ? -0.08 : 0.08;
      self.camera.userZoomMult = Math.max(0.55, Math.min(1.25, (self.camera.userZoomMult || 0.85) + delta));
    }, { passive: false });

    var startPointer = function(clientX, clientY) {
      window.SoundEngine.init();
      self.input.joyActive = true;
      self.input.joyStartX = clientX;
      self.input.joyStartY = clientY;
      self.input.joyCurX = clientX;
      self.input.joyCurY = clientY;
      self.input.joyDx = 0;
      self.input.joyDy = 0;
    };

    var movePointer = function(clientX, clientY) {
      if (!self.input.joyActive) return;
      self.input.joyCurX = clientX;
      self.input.joyCurY = clientY;
      var dx = clientX - self.input.joyStartX;
      var dy = clientY - self.input.joyStartY;
      var dist = Math.hypot(dx, dy);
      var maxR = 50;
      if (dist > 6) {
        var clamped = Math.min(dist, maxR) / maxR;
        self.input.joyDx = (dx / dist) * clamped;
        self.input.joyDy = (dy / dist) * clamped;
      } else {
        self.input.joyDx = 0;
        self.input.joyDy = 0;
      }
    };

    var endPointer = function(clientX, clientY) {
      if (!self.input.joyActive) return;
      var moved = Math.hypot(clientX - self.input.joyStartX, clientY - self.input.joyStartY);
      self.input.joyActive = false;
      self.input.joyDx = 0;
      self.input.joyDy = 0;

      if (moved < 14) {
        var pt = self.screenToWorld(clientX, clientY);
        self.hero.targetX = pt.x;
        self.hero.targetY = pt.y;
      }
    };

    this.canvas.addEventListener("mousedown", function(e) {
      startPointer(e.clientX, e.clientY);
    });
    window.addEventListener("mousemove", function(e) {
      movePointer(e.clientX, e.clientY);
    });
    window.addEventListener("mouseup", function(e) {
      endPointer(e.clientX, e.clientY);
    });

    this.canvas.addEventListener("touchstart", function(e) {
      if (e.touches.length > 0) {
        startPointer(e.touches[0].clientX, e.touches[0].clientY);
      }
    }, { passive: true });

    window.addEventListener("touchmove", function(e) {
      if (self.input.joyActive && e.touches.length > 0) {
        movePointer(e.touches[0].clientX, e.touches[0].clientY);
      }
    }, { passive: true });

    window.addEventListener("touchend", function(e) {
      var t = e.changedTouches && e.changedTouches[0];
      endPointer(t ? t.clientX : self.input.joyCurX, t ? t.clientY : self.input.joyCurY);
    }, { passive: true });
  },

  // ================= 2.5D CEL-SHADED RENDERER =================
  render: function() {
    var ctx = this.ctx;
    var cw = this.canvas.width;
    var ch = this.canvas.height;
    var realm = this.getCurrentRealm();

    var scaleX = cw / 1400;
    var scaleY = ch / 950;
    var baseZoom = Math.max(scaleX, scaleY) * (this.camera.userZoomMult || 0.85);
    if (cw < 650) {
      baseZoom = Math.max(0.55, baseZoom);
    }
    this.camera.zoom = baseZoom;

    var targetCamX = cw * 0.5 - this.hero.x * baseZoom;
    var targetCamY = ch * 0.5 - this.hero.y * baseZoom;
    var minCamX = cw - this.width * baseZoom;
    var minCamY = ch - this.height * baseZoom;
    this.camera.x = Math.min(0, Math.max(minCamX, targetCamX));
    this.camera.y = Math.min(0, Math.max(minCamY, targetCamY));

    ctx.fillStyle = realm.groundColor;
    ctx.fillRect(0, 0, cw, ch);

    ctx.save();
    ctx.translate(this.camera.x, this.camera.y);
    ctx.scale(this.camera.zoom, this.camera.zoom);

    this.drawForestCourtyardAndRoads(ctx, realm);
    this.drawTerritoryBoundaries(ctx);
    this.drawDungeonGateAndBraziers(ctx);
    this.drawBurnZones(ctx);
    this.drawWallsAndGates(ctx, realm);
    this.drawHalls(ctx);
    this.drawGroundLogosAndStatues(ctx);
    this.drawSceneryProps(ctx);
    this.drawLootDrops(ctx);
    this.drawAllies(ctx);
    this.drawEnemies(ctx);
    this.drawHero(ctx);
    this.drawProjectilesAndLightning(ctx);
    this.drawFlyingCoins(ctx);
    this.drawPointerHandOnQuestPad(ctx);
    this.drawParticlesAndTexts(ctx);

    ctx.restore();

    this.drawOffscreenThreatIndicators(ctx, cw, ch);
    this.drawTouchJoystick(ctx);
    if (this.isDefeated) {
      this.drawDefeatOverlay(ctx, cw, ch);
    }
  },

  drawForestCourtyardAndRoads: function(ctx, realm) {
    ctx.fillStyle = realm.grassDark || "#3e7533";
    for (var gx = 60; gx < this.width; gx += 140) {
      for (var gy = 80; gy < this.height; gy += 140) {
        ctx.beginPath();
        ctx.ellipse(gx + (gy % 280 === 0 ? 35 : 0), gy, 38, 18, 0, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    // Roads for active stage
    var roads = this.roads || [];
    roads.forEach(function(road) {
      var wps = road.waypoints;
      if (!wps || wps.length < 2) return;

      ctx.save();
      ctx.lineCap = "round";
      ctx.lineJoin = "round";

      ctx.strokeStyle = realm.pathBorder || "#78532a";
      ctx.lineWidth = (road.width || 110) + 18;
      ctx.beginPath();
      ctx.moveTo(wps[0].x, wps[0].y);
      for (var i = 1; i < wps.length; i++) {
        ctx.lineTo(wps[i].x, wps[i].y);
      }
      ctx.stroke();

      ctx.strokeStyle = realm.pathColor || "#b58952";
      ctx.lineWidth = road.width || 110;
      ctx.stroke();

      ctx.strokeStyle = "rgba(255, 255, 255, 0.12)";
      ctx.setLineDash([18, 22]);
      ctx.lineWidth = 6;
      ctx.stroke();
      ctx.restore();
    });
  },

  drawDungeonGateAndBraziers: function(ctx) {
    var mineLv = (this.state.pads["pad_GoldMine"] && this.state.pads["pad_GoldMine"].level) || 0;
    var time = performance.now() * 0.006;
    var padMine = (window.GAME_DATA.groundPads || []).find(function(p) { return p.type === "mine"; });
    if (!padMine) return;

    ctx.save();
    ctx.translate(padMine.x - 30, padMine.y - 70);

    ctx.fillStyle = "#68736b";
    ctx.strokeStyle = "#1c1917";
    ctx.lineWidth = 3.5;
    ctx.beginPath();
    ctx.roundRect(-60, -50, 120, 85, 8);
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = "#0f172a";
    ctx.beginPath();
    ctx.arc(0, -5, 26, Math.PI, 0, false);
    ctx.lineTo(26, 35);
    ctx.lineTo(-26, 35);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = "#fde047";
    ctx.font = "900 11px Inter, sans-serif";
    ctx.textAlign = "center";
    ctx.strokeStyle = "#000000";
    ctx.lineWidth = 3;
    var txt = mineLv > 0 ? "🔥 地下金庫 Lv." + mineLv : "🔥 地下金庫";
    ctx.strokeText(txt, 0, -35);
    ctx.fillText(txt, 0, -35);

    ctx.restore();
  },

  drawWallsAndGates: function(ctx, realm) {
    var wallLv = (this.state.pads["pad_WallFortify"] && this.state.pads["pad_WallFortify"].level) || 0;
    var hpPct = Math.max(0, Math.min(1, this.wall.hp / this.wall.maxHp));
    var segments = this.wallSegments || [];
    var turrets = this.bastionTurrets || [];
    var self = this;

    var wallBaseCol = wallLv >= 25 ? "#b45309" : (wallLv >= 10 ? "#334155" : "#4a544c");
    var wallTopCol = wallLv >= 25 ? "#fde047" : (wallLv >= 10 ? "#93c5fd" : (realm.wallTopColor || "#9ca898"));
    var trimCol = wallLv >= 25 ? "#fef08a" : (wallLv >= 10 ? "#38bdf8" : "#22c55e");

    segments.forEach(function(seg) {
      if (seg.type === "gate" || seg.isGate) {
        self.drawGatehouseArchway(ctx, seg, wallLv, hpPct);
      } else {
        self.drawSolidRampartSegment(ctx, seg, wallBaseCol, wallTopCol, trimCol, hpPct);
      }
    });

    turrets.forEach(function(t) {
      self.drawBastionTurret(ctx, t.x, t.y, wallLv, wallBaseCol, wallTopCol, trimCol);
    });
  },

  drawSolidRampartSegment: function(ctx, seg, baseCol, topCol, trimCol, hpPct) {
    var dx = seg.x2 - seg.x1;
    var dy = seg.y2 - seg.y1;
    var len = Math.hypot(dx, dy);
    var wallAng = Math.atan2(dy, dx);
    var steps = Math.max(3, Math.floor(len / 44));

    for (var s = 0; s <= steps; s++) {
      var t = s / steps;
      var bx = seg.x1 + dx * t;
      var by = seg.y1 + dy * t;

      ctx.save();
      ctx.translate(bx, by);
      ctx.rotate(wallAng);

      ctx.fillStyle = "rgba(0,0,0,0.40)";
      ctx.beginPath();
      ctx.roundRect(-26, -18, 52, 36, 6);
      ctx.fill();

      ctx.fillStyle = baseCol;
      ctx.strokeStyle = "#141416";
      ctx.lineWidth = 3.5;
      ctx.beginPath();
      ctx.roundRect(-24, -22, 48, 44, 6);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = topCol;
      ctx.strokeStyle = "#141416";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.roundRect(-26, -28, 52, 20, 5);
      ctx.fill();
      ctx.stroke();

      ctx.restore();
    }
  },

  drawGatehouseArchway: function(ctx, seg, wallLv, hpPct) {
    var midX = (seg.x1 + seg.x2) * 0.5;
    var midY = (seg.y1 + seg.y2) * 0.5;
    var dx = seg.x2 - seg.x1;
    var dy = seg.y2 - seg.y1;
    var gateLen = Math.hypot(dx, dy);
    var wallAng = Math.atan2(dy, dx);
    var time = performance.now() * 0.004;

    var isGateBreached = this.gateBreached;
    if (seg.cpIndex && this.checkpoints && this.checkpoints[seg.cpIndex - 1]) {
      isGateBreached = this.checkpoints[seg.cpIndex - 1].breached;
    }

    ctx.save();
    ctx.translate(midX, midY);
    ctx.rotate(wallAng);

    // Roadbed through gate
    ctx.fillStyle = "rgba(0,0,0,0.45)";
    ctx.fillRect(-gateLen * 0.5 - 6, -35, gateLen + 12, 70);

    var roadGrad = ctx.createLinearGradient(0, -35, 0, 35);
    roadGrad.addColorStop(0, "#a89f91");
    roadGrad.addColorStop(0.5, "#c4b5a0");
    roadGrad.addColorStop(1, "#8f8272");
    ctx.fillStyle = roadGrad;
    ctx.fillRect(-gateLen * 0.5, -32, gateLen, 64);

    // Green passing arrows
    var arrowPhase = (time * 3) % 1;
    ctx.fillStyle = isGateBreached ? "rgba(239, 68, 68, 0.85)" : "rgba(34, 197, 94, 0.75)";
    ctx.strokeStyle = isGateBreached ? "#f87171" : "#4ade80";
    ctx.lineWidth = 2.5;

    for (var a = -2; a <= 2; a++) {
      var ax = a * 24;
      var ay = -12 + arrowPhase * 24;
      if (ay > -28 && ay < 28) {
        ctx.beginPath();
        ctx.moveTo(ax - 8, ay - 6);
        ctx.lineTo(ax, ay + 4);
        ctx.lineTo(ax + 8, ay - 6);
        ctx.stroke();
      }
    }

    // Archway & Portcullis
    ctx.fillStyle = "#8c968e";
    ctx.strokeStyle = "#141416";
    ctx.lineWidth = 3.5;
    ctx.beginPath();
    ctx.roundRect(-gateLen * 0.5 + 10, -56, gateLen - 20, 24, 8);
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = "rgba(15, 23, 42, 0.92)";
    ctx.strokeStyle = isGateBreached ? "#ef4444" : "#22c55e";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.roundRect(-65, -80, 130, 20, 6);
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = isGateBreached ? "#f87171" : "#4ade80";
    ctx.font = "900 10.5px Inter, sans-serif";
    ctx.textAlign = "center";
    var gateName = (seg.name || "城門") + (isGateBreached ? " (已破)" : " (通衢)");
    ctx.fillText(gateName, 0, -66);

    ctx.restore();
  },

  drawBastionTurret: function(ctx, x, y, wallLv, baseCol, topCol, trimCol) {
    ctx.save();
    ctx.translate(x, y);

    ctx.fillStyle = baseCol;
    ctx.strokeStyle = "#141416";
    ctx.lineWidth = 3.6;
    ctx.beginPath();
    ctx.roundRect(-26, -42, 52, 58, 10);
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = topCol;
    ctx.beginPath();
    ctx.roundRect(-30, -54, 60, 18, 6);
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = wallLv >= 25 ? "#b45309" : (wallLv >= 10 ? "#1e3a8a" : "#78350f");
    ctx.beginPath();
    ctx.moveTo(-24, -54);
    ctx.lineTo(0, -96);
    ctx.lineTo(24, -54);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    ctx.restore();
  },

  // Draw All Halls (Main Citadel Keep + Outposts)
  drawHalls: function(ctx) {
    var self = this;
    (this.halls || []).forEach(function(h) {
      self.drawIndividualHall(ctx, h);
    });
  },

  drawIndividualHall: function(ctx, h) {
    var hallLv = (this.state.pads["pad_TownHall"] && this.state.pads["pad_TownHall"].level) || 1;
    var hpPct = Math.max(0, Math.min(1, h.hp / h.maxHp));
    var time = performance.now() * 0.005;

    ctx.save();
    ctx.translate(h.x, h.y);

    // Ground Shadow
    ctx.fillStyle = "rgba(0, 0, 0, 0.45)";
    ctx.beginPath();
    ctx.ellipse(0, 22, h.radius * 1.5, h.radius * 0.75, 0, 0, Math.PI * 2);
    ctx.fill();

    // Plinth
    ctx.fillStyle = "#334155";
    ctx.strokeStyle = "#0f172a";
    ctx.lineWidth = 3.5;
    ctx.beginPath();
    ctx.roundRect(-h.radius * 1.3, -28, h.radius * 2.6, 56, 10);
    ctx.fill();
    ctx.stroke();

    // Body
    ctx.fillStyle = h.flashTimer > 0 ? "#ffffff" : (h.isOutpost ? "#57534e" : "#475569");
    ctx.beginPath();
    ctx.roundRect(-h.radius, -68, h.radius * 2, 70, 8);
    ctx.fill();
    ctx.stroke();

    // Spire
    ctx.fillStyle = h.isOutpost ? "#b45309" : "#1d4ed8";
    ctx.beginPath();
    ctx.moveTo(-h.radius * 0.5, -68);
    ctx.lineTo(0, -118);
    ctx.lineTo(h.radius * 0.5, -68);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    // Banner Flag
    var flagWave = Math.sin(time * 4) * 4;
    ctx.strokeStyle = "#78350f";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(0, -118);
    ctx.lineTo(0, -145);
    ctx.stroke();

    ctx.fillStyle = h.isOutpost ? "#f59e0b" : "#dc2626";
    ctx.beginPath();
    ctx.moveTo(0, -145);
    ctx.lineTo(22 + flagWave, -137);
    ctx.lineTo(0, -129);
    ctx.closePath();
    ctx.fill();

    // Floating HP Bar & Title
    ctx.fillStyle = "rgba(15, 23, 42, 0.94)";
    ctx.strokeStyle = h.isOutpost ? "#f59e0b" : "#fbbf24";
    ctx.lineWidth = 2.2;
    ctx.beginPath();
    ctx.roundRect(-80, -170, 160, 22, 10);
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = hpPct > 0.4 ? (h.isOutpost ? "#f59e0b" : "#22c55e") : "#ef4444";
    ctx.beginPath();
    ctx.roundRect(-77, -167, 154 * hpPct, 16, 7);
    ctx.fill();

    ctx.fillStyle = "#ffffff";
    ctx.font = "900 10.5px Inter, sans-serif";
    ctx.textAlign = "center";
    ctx.strokeStyle = "#000000";
    ctx.lineWidth = 3;
    var hallText = (h.isOutpost ? "🛡️ " : "🏛️ ") + h.name + " (" + Math.ceil(h.hp) + "/" + h.maxHp + ")";
    ctx.strokeText(hallText, 0, -155);
    ctx.fillText(hallText, 0, -155);

    ctx.restore();
  },

  drawTerritoryBoundaries: function(ctx) {
    // Drawn if unlockedZones does not contain zone 1, 2, or 3
  },

  drawGroundLogosAndStatues: function(ctx) {
    var self = this;
    var time = performance.now() * 0.004;

    (window.GAME_DATA.groundPads || []).forEach(function(pad) {
      if (self.state.unlockedZones.indexOf(pad.zone) === -1) return;
      if (pad.type === "town_hall") return;

      var st = self.state.pads[pad.id] || { level: 0, invested: 0, cooldown: 0 };
      var cost = self.getPadCost(pad);
      var rem = self.getPadRemaining(pad);
      var avail = pad.currency === "mana" ? self.state.mana : self.state.gold;
      var canAfford = avail >= rem;
      var isStanding = self.hero.activePadId === pad.id;
      var isMax = st.level >= pad.maxLevel;
      var bp = pad.customizable ? self.getPadBlueprint(pad) : null;

      // Draw Tower / Barracks building
      if (pad.customizable && bp) {
        var tx = pad.towerX || pad.x;
        var ty = pad.towerY || (pad.y - 54);
        self.drawCelShadedTowerOrBarracks(ctx, pad, bp, st.level, tx, ty, time);
      }

      ctx.save();
      ctx.translate(pad.x, pad.y);

      if (isStanding || (canAfford && !isMax && st.level === 0)) {
        var pulse = 1 + Math.sin(time * 2.2) * 0.06;
        ctx.save();
        ctx.scale(pulse, pulse * 0.82);
        var haloGrad = ctx.createRadialGradient(0, 0, 34, 0, 0, 58);
        haloGrad.addColorStop(0, "rgba(56, 189, 248, 0.85)");
        haloGrad.addColorStop(0.6, "rgba(34, 211, 238, 0.45)");
        haloGrad.addColorStop(1, "rgba(34, 211, 238, 0)");
        ctx.fillStyle = haloGrad;
        ctx.beginPath();
        ctx.arc(0, 0, 58, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      ctx.save();
      ctx.scale(1, 0.82);

      ctx.fillStyle = "rgba(0, 0, 0, 0.35)";
      ctx.beginPath();
      ctx.arc(0, 5, 42, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = isStanding ? "#cbd5e1" : "#8c968e";
      ctx.strokeStyle = "#1e293b";
      ctx.lineWidth = 3.5;
      ctx.beginPath();
      ctx.arc(0, 0, 42, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = pad.type === "expand" ? "#3b2d54" : (bp && bp.category === "barracks" ? "#1e3a2f" : "#2e2842");
      ctx.strokeStyle = "#1e1b4b";
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.arc(0, 0, 34, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      if (st.invested > 0 && !isMax) {
        var prog = Math.min(1, st.invested / cost);
        ctx.strokeStyle = "#22c55e";
        ctx.lineWidth = 5.5;
        ctx.beginPath();
        ctx.arc(0, 0, 38, -Math.PI / 2, -Math.PI / 2 + prog * Math.PI * 2);
        ctx.stroke();
      }
      ctx.restore();

      var rawLabel = (bp ? bp.name : pad.name);
      ctx.font = "900 11px Inter, sans-serif";
      ctx.textAlign = "center";
      ctx.strokeStyle = "#000000";
      ctx.lineWidth = 3.2;
      ctx.fillStyle = "#ffffff";
      ctx.strokeText(rawLabel, 0, -4);
      ctx.fillText(rawLabel, 0, -4);

      if (!isMax) {
        var costStr = (st.cooldown && st.cooldown > 0) ? Math.ceil(st.cooldown) + "s" : (rem > 999 ? (rem / 1000).toFixed(1) + "k" : String(rem));
        ctx.fillStyle = pad.currency === "mana" ? "#c084fc" : "#fbbf24";
        ctx.strokeStyle = "#000";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(-14, 12, 5, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        ctx.font = "900 11px Inter, sans-serif";
        ctx.fillStyle = canAfford ? "#fde047" : "#f87171";
        ctx.strokeStyle = "#000000";
        ctx.lineWidth = 3;
        ctx.strokeText(costStr, 5, 16);
        ctx.fillText(costStr, 5, 16);
      } else {
        ctx.font = "900 10px Inter, sans-serif";
        ctx.fillStyle = "#4ade80";
        ctx.strokeText("MAX", 0, 14);
        ctx.fillText("MAX", 0, 14);
      }

      ctx.restore();
    });
  },

  drawCelShadedTowerOrBarracks: function(ctx, pad, bp, level, tx, ty, time) {
    ctx.save();
    ctx.translate(tx, ty);

    var kind = bp.projKind;
    if (kind === "frost") {
      ctx.fillStyle = "rgba(0,0,0,0.32)";
      ctx.beginPath();
      ctx.ellipse(0, 22, 38, 18, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = level >= 15 ? "#fde047" : "#8c968e";
      ctx.strokeStyle = "#1c1917";
      ctx.lineWidth = 3.5;
      ctx.beginPath();
      ctx.roundRect(-28, -55, 56, 75, 10);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = level > 0 ? "#38bdf8" : "#1e293b";
      ctx.beginPath();
      ctx.arc(0, -18, 10, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = "#2563eb";
      ctx.beginPath();
      ctx.moveTo(-26, -68);
      ctx.lineTo(0, -112);
      ctx.lineTo(26, -68);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
    } else if (kind === "hammer") {
      ctx.fillStyle = "#78827a";
      ctx.strokeStyle = "#1c1917";
      ctx.lineWidth = 3.2;
      ctx.beginPath();
      ctx.roundRect(-32, -8, 64, 32, 6);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = "#cbd5e1";
      ctx.beginPath();
      ctx.roundRect(-16, -46, 32, 28, 6);
      ctx.fill();
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(0, -56, 14, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = "#dc2626";
      ctx.beginPath();
      ctx.arc(-4, -70, 9, Math.PI * 0.8, Math.PI * 2.1);
      ctx.fill();
      ctx.stroke();
    } else if (bp.category === "barracks" && level > 0) {
      ctx.fillStyle = "rgba(0,0,0,0.32)";
      ctx.beginPath();
      ctx.ellipse(0, 14, 36, 16, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#475569";
      ctx.strokeStyle = "#0f172a";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.roundRect(-28, -36, 56, 46, 8);
      ctx.fill();
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(-34, -34);
      ctx.lineTo(0, -62);
      ctx.lineTo(34, -34);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      ctx.font = "18px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(bp.icon, 0, -38);
    } else if (level > 0) {
      ctx.save();
      ctx.translate(0, -28 + Math.sin(time * 2.5) * 2);
      ctx.fillStyle = bp.color || "#fde047";
      ctx.strokeStyle = "#1e1b4b";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(0, 0, 20, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
      ctx.font = "20px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(bp.icon, 0, 7);
      ctx.restore();
    }

    ctx.restore();
  },

  drawSceneryProps: function(ctx) {
    var time = performance.now() * 0.003;
    (this.scenery || []).forEach(function(s) {

      ctx.translate(s.x, s.y);

  // ================= Q-VERSION CHIBI 2-HEAD HERO RENDERING =================
  drawHero: function(ctx) {
    var cls = this.getCurrentHeroClass();

    ctx.translate(h.x, h.y);

    // Cute glowing circular magic aura on ground
    ctx.save();
    ctx.scale(1, 0.65);

    grad.addColorStop(0, "rgba(253, 224, 71, 0.45)");
    grad.addColorStop(0.7, "rgba(250, 204, 21, 0.85)");
    grad.addColorStop(1, "rgba(250, 204, 21, 0)");
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(0, 0, 32, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = "#fef08a";
    ctx.lineWidth = 2.5;
    ctx.setLineDash([4, 4]);
    ctx.beginPath();
    ctx.arc(0, 0, 24, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();

    // Destination guidance line
    if (h.targetX !== null && h.targetY !== null) {
      ctx.save();
      ctx.strokeStyle = "rgba(253, 224, 71, 0.6)";
      ctx.setLineDash([5, 5]);
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(h.targetX - h.x, h.targetY - h.y);
      ctx.stroke();
      ctx.restore();

    var bob = Math.sin(h.animPhase) * 2.5;

    ctx.save();

    ctx.strokeStyle = "#1e1b4b";
    ctx.lineWidth = 2.2;
    ctx.lineCap = "round";

    ctx.fillStyle = "#fed7aa";
    ctx.beginPath();
    ctx.arc(0, -24 + bob, 14.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    // Rosy blushing cheeks

    ctx.beginPath();

    ctx.fill();

    // Class-specific cute hair / beard
    if (cls.id === "archmage") {

      ctx.fillStyle = "#f8fafc";

      ctx.arc(0, -14 + bob, 7, 0, Math.PI, false);

      ctx.stroke();
    } else {

      ctx.arc(0, -32 + bob, 13, Math.PI * 0.9, Math.PI * 2.1, false);
      ctx.fill();

    // Sparkling anime chibi eyes (Large, shiny highlights)
    [-4.5, 4.5].forEach(function(ex) {
      // Eye base

      // Eye color iris

      // Sub sparkle
      ctx.beginPath();
      ctx.arc(ex + 1.2, -22 + bob, 0.7, 0, Math.PI * 2);
      ctx.fill();
    });

    // Cute smiling mouth
    ctx.strokeStyle = "#991b1b";

    ctx.beginPath();
    ctx.arc(0, -18 + bob, 2.8, 0.15, Math.PI - 0.15);

    ctx.strokeStyle = "#1e1b4b";
    ctx.lineWidth = 2.2;
    // Hat brim
    ctx.beginPath();
    ctx.ellipse(0, -32 + bob, 19, 6.5, 0, 0, Math.PI * 2);

    ctx.arc(17, -30 + bob, 6, 0, Math.PI * 2);

    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = "#fde047";
    ctx.font = "900 10px Inter, sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("★ Lv." + this.state.heroLevel + " " + cls.name, 0, -60 + bob);

    ctx.restore();

        ctx.moveTo(8, -8 - bob);
        ctx.quadraticCurveTo(22, -22 - bob - wingSpan, 18, 0 - bob);
        ctx.lineTo(8, 0 - bob);
        ctx.fill();
        ctx.stroke();

        // Chubby round red body with yellow tummy
        ctx.fillStyle = fTime ? "#ffffff" : "#dc2626";
        ctx.beginPath();
        ctx.roundRect(-10, -6 - bob, 20, 18, 7);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = "#fef08a";
        ctx.beginPath();
        ctx.ellipse(0, 3 - bob, 5.5, 6, 0, 0, Math.PI * 2);
        ctx.fill();

        // Giant round demon head (Radius 13.5px)
        ctx.fillStyle = fTime ? "#ffffff" : "#ef4444";
        ctx.beginPath();
        ctx.arc(0, -16 - bob, 13.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        // Rounded baby ram horns
        ctx.fillStyle = "#7f1d1d";
        ctx.beginPath();
        ctx.arc(-8, -25 - bob, 4.5, 0, Math.PI * 2);
        ctx.arc(8, -25 - bob, 4.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        // Rosy cheeks & big shining yellow eyes
        ctx.fillStyle = "rgba(254, 240, 138, 0.7)";
        ctx.beginPath();
        ctx.arc(-6.5, -11 - bob, 2.5, 0, Math.PI * 2);
        ctx.arc(6.5, -11 - bob, 2.5, 0, Math.PI * 2);
        ctx.fill();

        [-4.5, 4.5].forEach(function(ex) {
          ctx.fillStyle = "#0f172a";
          ctx.beginPath();
          ctx.ellipse(ex, -16 - bob, 3.2, 4, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = "#facc15";
          ctx.beginPath();
          ctx.arc(ex, -15 - bob, 2, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = "#ffffff";
          ctx.beginPath();
          ctx.arc(ex - 1, -17 - bob, 1.2, 0, Math.PI * 2);
          ctx.fill();
        });

      } else if (e.archId === "void_reaver") {
        // Cutified Void Reaver: Floating cute galaxy ghost with rounded curves, glowing teal visor, floating mini crescent wings!
        var floatBob = Math.sin(e.walkPhase * 1.5) * 4;
        // Floating cute mantle skirt
        ctx.fillStyle = fTime ? "#ffffff" : "#581c87";
        ctx.beginPath();
        ctx.moveTo(-12, -8 - floatBob);
        ctx.lineTo(12, -8 - floatBob);
        ctx.quadraticCurveTo(14, 16 - floatBob, 0, 18 - floatBob);
        ctx.quadraticCurveTo(-14, 16 - floatBob, -12, -8 - floatBob);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        // Big round head
        ctx.fillStyle = fTime ? "#ffffff" : "#3b0764";
        ctx.beginPath();
        ctx.arc(0, -17 - floatBob, 13, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        // Glowing cute cyan visor eyes
        ctx.fillStyle = "#22d3ee";
        ctx.beginPath();
        ctx.roundRect(-6.5, -18 - floatBob, 13, 4, 2);
        ctx.fill();

        // Purple blush
        ctx.fillStyle = "#d8b4fe";
        ctx.beginPath();
        ctx.arc(-6, -12 - floatBob, 2.2, 0, Math.PI * 2);
        ctx.arc(6, -12 - floatBob, 2.2, 0, Math.PI * 2);
        ctx.fill();

        // Floating baby crescent wings
        ctx.fillStyle = "#c084fc";
        ctx.beginPath();
        ctx.arc(-18, -4 - floatBob, 7, -Math.PI / 2, Math.PI / 2, false);
        ctx.arc(18, -4 - floatBob, 7, Math.PI / 2, -Math.PI / 2, false);
        ctx.fill();
        ctx.stroke();

      } else {
        // Cutified Realm Boss: Pouty baby tyrant king with an oversized sparkling golden crown, cute round horns, tiny stubby body, and giant cartoon greatsword!
        var bossBob = Math.sin(e.walkPhase * 0.8) * 3;
        // Chubby body
        ctx.fillStyle = fTime ? "#ffffff" : "#991b1b";
        ctx.beginPath();
        ctx.roundRect(-16, -10 - bossBob, 32, 26, 8);
        ctx.fill();
        ctx.stroke();

        // Massive Chibi King Head (Radius 18px)
        ctx.fillStyle = fTime ? "#ffffff" : "#b91c1c";
        ctx.beginPath();
        ctx.arc(0, -26 - bossBob, 18, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        // Cute blunt rounded horns
        ctx.fillStyle = "#450a0a";
        ctx.beginPath();
        ctx.arc(-13, -37 - bossBob, 5.5, 0, Math.PI * 2);
        ctx.arc(13, -37 - bossBob, 5.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();

        // Oversized Sparkling Golden King Crown!
        ctx.fillStyle = "#fde047";
        ctx.strokeStyle = "#b45309";
        ctx.lineWidth = 2.2;
        ctx.beginPath();
        ctx.moveTo(-13, -42 - bossBob);
        ctx.lineTo(-7, -54 - bossBob);
        ctx.lineTo(0, -45 - bossBob);
        ctx.lineTo(7, -54 - bossBob);
        ctx.lineTo(13, -42 - bossBob);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        // Blushing cheeks
        ctx.fillStyle = "rgba(254, 205, 211, 0.85)";
        ctx.beginPath();
        ctx.ellipse(-9, -20 - bossBob, 4, 2.5, 0, 0, Math.PI * 2);
        ctx.ellipse(9, -20 - bossBob, 4, 2.5, 0, 0, Math.PI * 2);
        ctx.fill();

        // Giant glistening anime eyes
        [-6, 6].forEach(function(ex) {
          ctx.fillStyle = "#0f172a";
          ctx.beginPath();
          ctx.ellipse(ex, -26 - bossBob, 4.2, 5.5, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = "#f43f5e";
          ctx.beginPath();
          ctx.arc(ex, -24.5 - bossBob, 3, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = "#ffffff";
          ctx.beginPath();
          ctx.arc(ex - 1.5, -28 - bossBob, 1.8, 0, Math.PI * 2);
          ctx.fill();
          ctx.beginPath();
          ctx.arc(ex + 1.5, -23 - bossBob, 0.9, 0, Math.PI * 2);
          ctx.fill();
        });

        // Cute pouting mouth
        ctx.strokeStyle = "#450a0a";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(0, -17 - bossBob, 3.5, Math.PI * 0.15, Math.PI * 0.85, true);
        ctx.stroke();

        // Giant cartoon greatsword
        ctx.strokeStyle = "#334155";
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(18, 12 - bossBob);
        ctx.lineTo(26, -38 - bossBob);
        ctx.stroke();
        ctx.fillStyle = "#f59e0b";
        ctx.beginPath();
        ctx.roundRect(22, -36 - bossBob, 8, 8, 2);
        ctx.fill();
      }

      // Cute Rounded Health Bar
      var barW = e.isBoss ? 60 : 26;
      var pct = Math.max(0, e.hp / e.maxHp);
      ctx.fillStyle = "rgba(0,0,0,0.8)";
      ctx.beginPath();
      ctx.roundRect(-barW / 2, -e.radius - 22, barW, 4.5, 2.5);
      ctx.fill();
      ctx.fillStyle = e.isBoss ? "#f43f5e" : "#22c55e";
      ctx.beginPath();
      ctx.roundRect(-barW / 2 + 0.5, -e.radius - 21.5, (barW - 1) * pct, 3.5, 2);
      ctx.fill();

      ctx.restore();
    }
  },

  drawLootDrops: function(ctx) {
    for (var i = 0; i < this.lootDrops.length; i++) {
      var d = this.lootDrops[i];
      ctx.save();
      ctx.translate(d.x, d.y);
      if (d.kind === "gold") {
        ctx.fillStyle = "#facc15";
        ctx.strokeStyle = "#1c1917";
        ctx.lineWidth = 2.2;
        ctx.beginPath();
        ctx.ellipse(0, 0, 8.5, 6.5, 0.15, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
      } else if (d.kind === "mana") {
        ctx.fillStyle = "#38bdf8";
        ctx.strokeStyle = "#0f172a";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(0, -9);
        ctx.lineTo(8, 0);
        ctx.lineTo(0, 9);
        ctx.lineTo(-8, 0);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
      } else {
        ctx.font = "19px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("🎁", 0, 6);
      }
      ctx.restore();
    }
  },

  drawFlyingCoins: function(ctx) {
    for (var i = 0; i < this.flyingCoins.length; i++) {
      var fc = this.flyingCoins[i];
      var t = fc.progress;
      var cx = fc.sx + (fc.tx - fc.sx) * t;
      var cy = fc.sy + (fc.ty - fc.sy) * t - Math.sin(t * Math.PI) * fc.arcHeight;

      ctx.save();
      ctx.translate(cx, cy);
      ctx.fillStyle = fc.currency === "mana" ? "#38bdf8" : "#fde047";
      ctx.strokeStyle = "#1c1917";
      ctx.lineWidth = 2.2;
      ctx.beginPath();
      ctx.arc(0, 0, 7.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
      ctx.restore();
    }
  },

  drawBurnZones: function(ctx) {
    for (var i = 0; i < this.burnZones.length; i++) {
      var bz = this.burnZones[i];
      ctx.save();
      ctx.fillStyle = "rgba(249, 115, 22, 0.28)";
      ctx.strokeStyle = "rgba(251, 146, 60, 0.65)";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(bz.x, bz.y, bz.radius, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
      ctx.restore();
    }
  },

  drawProjectilesAndLightning: function(ctx) {
    for (var l = 0; l < this.lightningArcs.length; l++) {
      var arc = this.lightningArcs[l];
      ctx.save();
      ctx.strokeStyle = arc.color || "#60a5fa";
      ctx.shadowColor = "#38bdf8";
      ctx.shadowBlur = 10;
      ctx.lineWidth = 3.5;
      ctx.beginPath();
      ctx.moveTo(arc.x1, arc.y1);
      var midX = (arc.x1 + arc.x2) * 0.5 + (Math.random() - 0.5) * 26;
      var midY = (arc.y1 + arc.y2) * 0.5 + (Math.random() - 0.5) * 26;
      ctx.lineTo(midX, midY);
      ctx.lineTo(arc.x2, arc.y2);
      ctx.stroke();
      ctx.restore();
    }

    for (var i = 0; i < this.projectiles.length; i++) {
      var p = this.projectiles[i];
      var ang = Math.atan2(p.vy, p.vx);
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(ang);

      var grad = ctx.createLinearGradient(-24, 0, 6, 0);
      grad.addColorStop(0, "rgba(56, 189, 248, 0)");
      grad.addColorStop(1, p.color || "#38bdf8");
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.moveTo(-26, -5);
      ctx.lineTo(6, -7);
      ctx.lineTo(6, 7);
      ctx.lineTo(-26, 5);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = "#ffffff";
      ctx.strokeStyle = p.color || "#38bdf8";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(2, 0, 6, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
      ctx.restore();
    }
  },

  drawPointerHandOnQuestPad: function(ctx) {
    var adv = this.getTacticalAdvice();
    var targetPadId = (adv && adv.targetPadId) || "pad_FrostStatue";
    var pad = window.GAME_DATA.groundPads.find(function(p) { return p.id === targetPadId; }) || window.GAME_DATA.groundPads[0];
    if (!pad || this.state.unlockedZones.indexOf(pad.zone) === -1) return;

    var time = performance.now() * 0.005;
    var bounce = Math.sin(time * 2.2) * 8;

    ctx.save();
    ctx.translate(pad.x + 36 + bounce * 0.5, pad.y + 38 + bounce);
    ctx.rotate(-0.45);

    ctx.fillStyle = "rgba(0,0,0,0.35)";
    ctx.beginPath();
    ctx.arc(4, 6, 22, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "#fed7aa";
    ctx.strokeStyle = "#1c1917";
    ctx.lineWidth = 3.5;
    ctx.beginPath();
    ctx.roundRect(-8, -34, 15, 30, 7);
    ctx.fill();
    ctx.stroke();

    ctx.beginPath();
    ctx.roundRect(-16, -12, 34, 28, 12);
    ctx.fill();
    ctx.stroke();

    ctx.restore();
  },

  // Directional Danger Indicators at Screen Edges
  drawOffscreenThreatIndicators: function(ctx, cw, ch) {
    var counts = this.roadEnemyCounts;
    var roadsInfo = [
      { id: "road_north", name: "北路", count: counts.road_north, screenX: cw * 0.5, screenY: 82, arrow: "▲" },
      { id: "road_center", name: "中路", count: counts.road_center, screenX: cw - 65, screenY: ch * 0.5, arrow: "▶" },
      { id: "road_south", name: "南路", count: counts.road_south, screenX: cw * 0.5, screenY: ch - 95, arrow: "▼" }
    ];

    roadsInfo.forEach(function(r) {
      if (r.count > 0) {
        ctx.save();
        ctx.fillStyle = "rgba(220, 38, 38, 0.92)";
        ctx.strokeStyle = "#fef08a";
        ctx.lineWidth = 1.8;
        ctx.beginPath();
        ctx.roundRect(r.screenX - 44, r.screenY - 14, 88, 26, 12);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = "#ffffff";
        ctx.font = "900 11px Inter, sans-serif";
        ctx.textAlign = "center";
        ctx.fillText(r.arrow + " " + r.name + " (" + r.count + ")", r.screenX, r.screenY + 4);
        ctx.restore();
      }
    });
  },

  drawParticlesAndTexts: function(ctx) {
    for (var i = 0; i < this.particles.length; i++) {
      var p = this.particles[i];
      ctx.save();
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
    for (var j = 0; j < this.floatingTexts.length; j++) {
      var ft = this.floatingTexts[j];
      ctx.save();
      ctx.globalAlpha = Math.max(0, Math.min(1, ft.life));
      ctx.font = "900 " + ft.size + "px Inter, sans-serif";
      ctx.textAlign = "center";
      ctx.strokeStyle = "rgba(0,0,0,0.9)";
      ctx.lineWidth = 3.5;
      ctx.strokeText(ft.text, ft.x, ft.y);
      ctx.fillStyle = ft.color;
      ctx.fillText(ft.text, ft.x, ft.y);
      ctx.restore();
    }
  },

  drawDefeatOverlay: function(ctx, cw, ch) {
    ctx.save();
    ctx.fillStyle = "rgba(10, 8, 20, 0.88)";
    ctx.fillRect(0, 0, cw, ch);

    ctx.fillStyle = "#ef4444";
    ctx.font = "900 28px Inter, sans-serif";
    ctx.textAlign = "center";
    ctx.strokeStyle = "#000";
    ctx.lineWidth = 5;
    ctx.strokeText("💥 城池淪陷！守護大本營被摧毀！", cw / 2, ch / 2 - 50);
    ctx.fillText("💥 城池淪陷！守護大本營被摧毀！", cw / 2, ch / 2 - 50);

    ctx.fillStyle = "#fde047";
    ctx.font = "800 15px Inter, sans-serif";
    var sub = "堅守進度：第 " + this.state.wave + " 波 | 累計殲敵：" + this.state.totalKills + " 隻";
    ctx.strokeText(sub, cw / 2, ch / 2 - 15);
    ctx.fillText(sub, cw / 2, ch / 2 - 15);

    ctx.restore();
  },

  drawTouchJoystick: function(ctx) {
    if (!this.input.joyActive) return;
    ctx.save();
    ctx.strokeStyle = "rgba(251, 191, 36, 0.55)";
    ctx.fillStyle = "rgba(15, 12, 28, 0.35)";
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.arc(this.input.joyStartX, this.input.joyStartY, 48, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    var knobX = this.input.joyStartX + this.input.joyDx * 48;
    var knobY = this.input.joyStartY + this.input.joyDy * 48;
    ctx.fillStyle = "rgba(251, 191, 36, 0.88)";
    ctx.beginPath();
    ctx.arc(knobX, knobY, 20, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
};


/* ==========================================================================
   Ancient Arcane Bastion (古域魔陣：守護神殿) - Mobile UI, Modals & Defense Hub (v1.6.0)
   - Ultra-compact 2-Row Top HUD (Height <= 68px, perfect for iPhone)
   - Locked 3-Line Upgrade View for built towers (Dmg, Speed, Range, Pouring bar)
   - Type-First selection for empty plots (Type -> Towers -> Confirm Build)
   - Multi-hall & Multi-checkpoint status rendering
   - 4-Tier Hierarchical Skill Tree with SVG Connectors & Node Inspector
   ========================================================================== */

window.GameUI = {
  activeModal: null,
  uiTimer: 0,
  selectedBuildTypeId: "type_elemental",
  selectedBuildBpId: "bp_arcane_spire",
  activeSkillBranch: "combat",
  selectedTalentId: "t_hero_dmg",

  init: function() {
    this.updateHUD();
    this.updateTopButtons();
  },

  tickUI: function(dt) {
    this.uiTimer += dt;
    if (this.uiTimer >= 0.15) {
      this.uiTimer = 0;
      this.updateHUD();
      this.updateContextCard();
      this.updateSkillCooldowns();
    }
  },

  formatNum: function(n) {
    var v = Math.floor(n);
    if (v >= 1000000) return (v / 1000000).toFixed(2) + "M";
    if (v >= 10000) return (v / 1000).toFixed(1) + "K";
    return String(v);
  },

  isTalentUnlocked: function(tal) {
    if (!tal || !tal.reqId) return true;
    var st = window.GameEngine.state;
    var reqLv = tal.reqLv || 3;
    var p1Lv = st.talents[tal.reqId] || 0;
    if (p1Lv >= reqLv) return true;
    if (tal.reqIdAlt) {
      var p2Lv = st.talents[tal.reqIdAlt] || 0;
      if (p2Lv >= reqLv) return true;
    }
    return false;
  },

  getTalentPrerequisiteText: function(tal) {
    if (!tal || !tal.reqId) {
      return { unlocked: true, text: "✅ 第 1 階核心根基（初始已解鎖）" };
    }
    var st = window.GameEngine.state;
    var reqLv = tal.reqLv || 3;
    var p1 = window.GAME_DATA.talents.find(function(t) { return t.id === tal.reqId; });
    var p1Lv = st.talents[tal.reqId] || 0;
    var unlocked = this.isTalentUnlocked(tal);

    if (tal.reqIdAlt) {
      var p2 = window.GAME_DATA.talents.find(function(t) { return t.id === tal.reqIdAlt; });
      var p2Lv = st.talents[tal.reqIdAlt] || 0;
      var txt = (unlocked ? "✅ 前置已達成：" : "🔒 前置條件：需") +
        "【" + (p1 ? p1.name : "") + "】(Lv." + p1Lv + "/" + reqLv + ") 或 【" +
        (p2 ? p2.name : "") + "】(Lv." + p2Lv + "/" + reqLv + ") 達 Lv." + reqLv;
      return { unlocked: unlocked, text: txt };
    }

    var singleTxt = (unlocked ? "✅ 前置已達成：" : "🔒 前置條件：需先將") +
      "【" + (p1 ? p1.name : "") + "】升至 Lv." + reqLv + "（當前 Lv." + p1Lv + "/" + reqLv + "）";
    return { unlocked: unlocked, text: singleTxt };
  },

  // ================= ULTRA-COMPACT 2-ROW TOP HUD =================
  updateHUD: function() {
    var eng = window.GameEngine;
    if (!eng || !eng.state) return;
    var st = eng.state;

    // 1. Resources
    var elGold = document.getElementById("hud-gold");
    var elMana = document.getElementById("hud-mana");
    var elSoul = document.getElementById("hud-soul");
    if (elGold) elGold.textContent = this.formatNum(st.gold);
    if (elMana) elMana.textContent = this.formatNum(st.mana);
    if (elSoul) elSoul.textContent = this.formatNum(st.souls);

    // 2. Defense Status (Adapts to Stage Layout!)
    var elWallLbl = document.getElementById("hud-wall-lbl");
    var elWallText = document.getElementById("hud-wall-text");
    var elWallBar = document.getElementById("hud-wall-bar");

    if (eng.layoutType === "long_line_three_checkpoints" && eng.checkpoints && eng.checkpoints.length > 0) {
      // Find active checkpoint
      var activeCp = eng.checkpoints.find(function(c) { return !c.breached; }) || eng.checkpoints[2];
      if (elWallLbl) elWallLbl.textContent = "關卡 #" + activeCp.index;
      if (elWallText) elWallText.textContent = Math.ceil(activeCp.hp) + "/" + activeCp.maxHp;
      if (elWallBar && activeCp.maxHp > 0) {
        var cpPct = Math.max(0, Math.min(100, Math.round((activeCp.hp / activeCp.maxHp) * 100)));
        elWallBar.style.width = cpPct + "%";
        elWallBar.style.background = cpPct < 30 ? "#ef4444" : (cpPct < 60 ? "#f59e0b" : "#38bdf8");
      }
    } else if (eng.layoutType === "multiple_halls_outpost") {
      var outpost = (eng.halls || []).find(function(h) { return h.isOutpost; });
      if (outpost && outpost.hp > 0) {
        if (elWallLbl) elWallLbl.textContent = "前哨廳";
        if (elWallText) elWallText.textContent = Math.ceil(outpost.hp) + "/" + outpost.maxHp;
        if (elWallBar && outpost.maxHp > 0) {
          var oPct = Math.max(0, Math.min(100, Math.round((outpost.hp / outpost.maxHp) * 100)));
          elWallBar.style.width = oPct + "%";
          elWallBar.style.background = oPct < 30 ? "#ef4444" : "#f59e0b";
        }
      } else {
        if (elWallLbl) elWallLbl.textContent = "城防(已破)";
        if (elWallText) elWallText.textContent = "0/" + eng.wall.maxHp;
        if (elWallBar) elWallBar.style.width = "0%";
      }
    } else {
      if (elWallLbl) elWallLbl.textContent = "城防耐久";
      if (elWallText && eng.wall) elWallText.textContent = Math.ceil(eng.wall.hp) + "/" + eng.wall.maxHp;
      if (elWallBar && eng.wall && eng.wall.maxHp > 0) {
        var wPct = Math.max(0, Math.min(100, Math.round((eng.wall.hp / eng.wall.maxHp) * 100)));
        elWallBar.style.width = wPct + "%";
        elWallBar.style.background = wPct < 30 ? "#ef4444" : (wPct < 60 ? "#f59e0b" : "#38bdf8");
      }
    }

    // Town Hall Core
    var elHallText = document.getElementById("hud-hall-text");
    var elHallBar = document.getElementById("hud-hall-bar");
    if (elHallText && eng.townHall) elHallText.textContent = Math.ceil(eng.townHall.hp) + "/" + eng.townHall.maxHp;
    if (elHallBar && eng.townHall && eng.townHall.maxHp > 0) {
      var hPct = Math.max(0, Math.min(100, Math.round((eng.townHall.hp / eng.townHall.maxHp) * 100)));
      elHallBar.style.width = hPct + "%";
      elHallBar.style.background = hPct < 30 ? "#ef4444" : (hPct < 60 ? "#f59e0b" : "#22c55e");
    }

    // 3. Compact 1-Line Ticker (Clickable to open Codex/Advisor/Quest)
    var elTicker = document.getElementById("hud-ticker-text");
    var elRadarDot = document.getElementById("hud-radar-dot");
    var realm = eng.getCurrentRealm();
    var enemyCount = eng.enemies.length;

    if (elTicker) {
      elTicker.textContent = realm.name.split("：")[0] + " · 第 " + st.wave + " 波 | ⚔️ " + enemyCount + " 敵";
      if (elRadarDot) {
        elRadarDot.style.background = (enemyCount > 8 || eng.gateBreached) ? "#ef4444" : "#22c55e";
      }
    }

    var dotTalent = document.getElementById("dot-talent");
    if (dotTalent) {
      dotTalent.style.display = st.souls >= 1 ? "block" : "none";
    }

    if (eng.townHall && eng.townHall.hp <= 0 && this.activeModal !== "defeat") {
      this.openModal("defeat");
    }
  },

  // ================= STEP-ON CONTEXT CARD (CLEAN & NON-OBSTRUCTIVE) =================
  updateContextCard: function() {
    var card = document.getElementById("pad-context-card");
    if (!card) return;
    var eng = window.GameEngine;
    var padId = eng.hero.activePadId;

    if (!padId) {
      card.classList.add("hidden");
      return;
    }

    var pad = (window.GAME_DATA.groundPads || []).find(function(p) { return p.id === padId; });
    if (!pad) {
      card.classList.add("hidden");
      return;
    }

    card.classList.remove("hidden");
    var st = eng.state.pads[pad.id] || { level: 0, invested: 0 };
    var rem = eng.getPadRemaining(pad);
    var cost = eng.getPadCost(pad);
    var curIcon = pad.currency === "mana" ? "💎" : "🪙";
    var bp = pad.customizable ? eng.getPadBlueprint(pad) : null;
    var isBuilt = st.level >= 1;

    // CASE 1: Built Customizable Tower (LOCKED - CANNOT CHANGE TYPE AFTER BUILT!)
    if (pad.customizable && isBuilt && bp) {
      var calcDmg = eng.getTowerDamage(pad, st.level);
      var progPct = Math.min(100, Math.round((st.invested / cost) * 100));

      var html = '<div class="pad-built-view">';
      // Line 1: Tower Title, Level, Role & Upgrade Cost
      html += '<div class="pad-header-row">';
      html += '<span class="pad-title-text">' + bp.icon + ' ' + bp.name + ' Lv.' + st.level + ' (' + bp.roleTag + ')</span>';
      if (st.level >= pad.maxLevel) {
        html += '<span class="pad-cost-badge" style="color:#4ade80;">✨ 已達最高級</span>';
      } else {
        html += '<span class="pad-cost-badge">⬆️ 升級需 ' + curIcon + rem + '</span>';
      }
      html += '</div>';

      // Line 2: The 3 essential stats (Damage, Atk Rate, Range or Troop stats)
      html += '<div class="pad-stats-strip">';
      if (bp.category === "barracks") {
        html += '<span class="pad-stat-pill">🛡️ 兵命: ' + bp.troopHp + '</span>';
        html += '<span class="pad-stat-pill">⚔️ 兵攻: ' + bp.troopDmg + '</span>';
        html += '<span class="pad-stat-pill">⏱️ 出兵: ' + bp.spawnInterval + 's</span>';
      } else {
        html += '<span class="pad-stat-pill">💥 傷害: ' + calcDmg + '</span>';
        html += '<span class="pad-stat-pill">⚡ 攻速: ' + bp.atkRate + 's</span>';
        html += '<span class="pad-stat-pill">🎯 射程: ' + bp.range + '</span>';
      }
      html += '<span style="color:#94a3b8;font-size:0.65rem;margin-left:auto;">[類型已鎖定]</span>';
      html += '</div>';

      // Line 3: Thin Pouring Progress Bar
      if (st.level < pad.maxLevel) {
        html += '<div class="pad-progress-track"><div class="pad-progress-fill" style="width:' + progPct + '%;"></div></div>';
      }
      html += '</div>';

      card.innerHTML = html;
      return;
    }

    // CASE 2: Unbuilt Customizable Plot (st.level === 0) -> Select Type First -> Pick Tower -> Confirm Build!
    if (pad.customizable && !isBuilt) {
      var self = this;
      var curType = (window.GAME_DATA.towerTypes || []).find(function(t) { return t.id === self.selectedBuildTypeId; }) || window.GAME_DATA.towerTypes[0];
      var towersOfType = window.GAME_DATA.towerBlueprints.filter(function(b) { return b.typeId === self.selectedBuildTypeId; });
      var activeBp = eng.getBlueprintById(self.selectedBuildBpId || towersOfType[0].id);
      var canAfford = eng.state.gold >= activeBp.buildCostGold;

      var htmlU = '<div class="pad-unbuilt-view">';
      // Header
      htmlU += '<div class="pad-header-row">';
      htmlU += '<span class="pad-title-text" style="color:#38bdf8;">🔮 空置陣位 · 請先選類型</span>';
      htmlU += '<span style="font-size:0.64rem;color:#fde047;font-weight:700;">建造後即永久鎖定</span>';
      htmlU += '</div>';

      // Step 1: Type Tabs
      htmlU += '<div class="type-tabs-row">';
      (window.GAME_DATA.towerTypes || []).forEach(function(tType) {
        var isAct = self.selectedBuildTypeId === tType.id;
        htmlU += '<button class="type-tab-btn ' + (isAct ? 'active-type-tab' : '') + '" onclick="window.uiSelectBuildType(\'" + pad.id + "\', \'" + tType.id + "\')">';
        htmlU += tType.icon + ' ' + tType.shortName;
        htmlU += '</button>';
      });
      htmlU += '</div>';

      // Step 2: Towers of that type
      htmlU += '<div class="tower-picker-strip">';
      towersOfType.forEach(function(b) {
        var isSel = activeBp.id === b.id;
        var unl = eng.isBlueprintUnlocked(b.id);
        htmlU += '<button class="tower-chip ' + (isSel ? 'selected-preview-chip' : '') + '" onclick="window.uiSelectBuildTower(\'" + pad.id + "\', \'" + b.id + "\')">';
        htmlU += '<span>' + b.icon + ' ' + b.name + '</span>';
        htmlU += '<span style="font-size:0.62rem;color:' + (unl ? '#4ade80' : '#fde047') + ';">' + (unl ? '🪙' + b.buildCostGold : '🔒解鎖') + '</span>';
        htmlU += '</button>';
      });
      htmlU += '</div>';

      // Step 3: Brief Description & Confirm Build Button
      htmlU += '<div class="pad-build-confirm-row">';
      htmlU += '<span class="pad-bp-summary">' + activeBp.icon + ' ' + activeBp.name + '：' + activeBp.roleTag + ' | ' + activeBp.adviceTag + '</span>';
      htmlU += '<button class="btn-build-confirm" onclick="window.uiBuildTower(\'" + pad.id + "\', \'" + activeBp.id + "\')">';
      htmlU += '🔨 建造 (' + (activeBp.unlockCurrency === 'mana' ? '💎' : '🪙') + activeBp.buildCostGold + ')';
      htmlU += '</button>';
      htmlU += '</div>';

      htmlU += '</div>';
      card.innerHTML = htmlU;
      return;
    }

    // CASE 3: Non-Customizable Functional Building (Town Hall, Wall Fortify, Gold Mine, Mana Well, Forge, Shrine, Portal, Expand)
    var htmlF = '<div class="pad-built-view">';
    htmlF += '<div class="pad-header-row">';
    htmlF += '<span class="pad-title-text">' + pad.icon + ' ' + pad.name + (pad.type === 'expand' ? '' : ' Lv.' + st.level) + '</span>';
    if (st.level >= pad.maxLevel) {
      htmlF += '<span class="pad-cost-badge" style="color:#4ade80;">✨ 最高級</span>';
    } else {
      htmlF += '<span class="pad-cost-badge">⬆️ 踏陣需 ' + curIcon + rem + '</span>';
    }
    htmlF += '</div>';
    htmlF += '<div style="font-size:0.68rem;color:#cbd5e1;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">' + pad.desc + '</div>';
    if (st.level < pad.maxLevel && st.invested > 0) {
      var pPct = Math.min(100, Math.round((st.invested / cost) * 100));
      htmlF += '<div class="pad-progress-track"><div class="pad-progress-fill" style="width:' + pPct + '%;"></div></div>';
    }
    htmlF += '</div>';
    card.innerHTML = htmlF;
  },

  updateSkillCooldowns: function() {

      var cdEl = document.getElementById("skill-cd-" + i);
      if (cdEl && sk) {

          cdEl.style.display = "flex";
          cdEl.textContent = Math.ceil(sk.cd) + "s";
        } else {

    var btnAi = document.getElementById("btn-ai-toggle");

      var labels = ["🤖 AI: 手動", "🤖 AI: 撿幣", "🤖 AI: 踏陣"];

  showToast: function(msg) {
    var container = document.getElementById("toast-container");
    if (!container) return;
    var div = document.createElement("div");
    div.className = "toast-msg";
    div.textContent = msg;
    container.appendChild(div);
    setTimeout(function() {
      if (div.parentNode) div.parentNode.removeChild(div);
    }, 2500);
  },

  openModal: function(tabName) {
    this.activeModal = tabName;
    var backdrop = document.getElementById("modal-backdrop");
    var titleEl = document.getElementById("modal-title");
    var bodyEl = document.getElementById("modal-body");
    if (!backdrop || !titleEl || !bodyEl) return;

    backdrop.classList.remove("hidden");

    if (tabName === "pads") {
      titleEl.innerHTML = "🏰 防線陣位與建築總覽";
      this.renderPadsModal(bodyEl);
    } else if (tabName === "townhall") {
      titleEl.innerHTML = "🏛️ 守護大本營與防線樞紐";
      this.renderTownHallModal(bodyEl);
    } else if (tabName === "hero") {
      titleEl.innerHTML = "⚔️ 英雄職業與聖物鍛造";
      this.renderHeroModal(bodyEl);
    } else if (tabName === "talents") {
      titleEl.innerHTML = "🌟 太古星盤技能科技樹";
      this.renderTalentsModal(bodyEl);
    } else if (tabName === "realms") {
      titleEl.innerHTML = "🗺️ 古域五大章節與古神轉生";
      this.renderRealmsModal(bodyEl);
    } else if (tabName === "codex") {
      titleEl.innerHTML = "📖 軍情戰役任務與魔物圖鑑";
      this.renderCodexModal(bodyEl);
    } else if (tabName === "defeat") {
      titleEl.innerHTML = "⚠️ 要塞淪陷 — 大本營被毀";
      this.renderDefeatModal(bodyEl);
    }
  },

  closeModal: function() {
    this.activeModal = null;
    var backdrop = document.getElementById("modal-backdrop");
    if (backdrop) backdrop.classList.add("hidden");
  },
